name: Android ARMv7 build

on:
  workflow_dispatch:
  push:
    paths:
      - 'JARVIS-32bit-corrected-source.zip'
      - '.github/workflows/android-armv7-build.yml'

jobs:
  build-armv7:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack corrected source
        run: unzip -q JARVIS-32bit-corrected-source.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true
      - name: Install dependencies
        working-directory: JARVIS-32bit-corrected/jarvis_app
        run: flutter pub get
      - name: Analyze
        working-directory: JARVIS-32bit-corrected/jarvis_app
        run: flutter analyze
      - name: Run tests
        working-directory: JARVIS-32bit-corrected/jarvis_app
        run: flutter test
      - name: Decode release keystore
        # Signs the release APK with the real keystore when the secrets are
        # set (v1.1.0). Without them the build falls back to the debug
        # signing key, exactly as v1.0.8 did. Secrets are never echoed.
        # NOTE: `secrets` may NOT appear in an `if:` expression — GitHub
        # rejects the whole workflow file at parse time ("Unrecognized
        # named-value: 'secrets'"). The empty-secret check therefore lives
        # inside the script, via env vars. The heredoc is quoted ('EOF')
        # so password characters are written verbatim.
        env:
          JARVIS_RELEASE_KEYSTORE_B64: ${{ secrets.JARVIS_RELEASE_KEYSTORE_B64 }}
          JARVIS_RELEASE_STORE_PASSWORD: ${{ secrets.JARVIS_RELEASE_STORE_PASSWORD }}
          JARVIS_RELEASE_KEY_ALIAS: ${{ secrets.JARVIS_RELEASE_KEY_ALIAS }}
          JARVIS_RELEASE_KEY_PASSWORD: ${{ secrets.JARVIS_RELEASE_KEY_PASSWORD }}
        run: |
          if [ -z "$JARVIS_RELEASE_KEYSTORE_B64" ]; then
            echo "No release keystore secret set; using debug signing."
            exit 0
          fi
          echo "$JARVIS_RELEASE_KEYSTORE_B64" | base64 -d > JARVIS-32bit-corrected/jarvis_app/android/app/keystore.jks
          cat > JARVIS-32bit-corrected/jarvis_app/android/key.properties <<'EOF'
          storeFile=keystore.jks
          storePassword=${{ secrets.JARVIS_RELEASE_STORE_PASSWORD }}
          keyAlias=${{ secrets.JARVIS_RELEASE_KEY_ALIAS }}
          keyPassword=${{ secrets.JARVIS_RELEASE_KEY_PASSWORD }}
          EOF
      - name: Configure local Android SDK paths
        working-directory: JARVIS-32bit-corrected/jarvis_app/android
        run: |
          printf 'flutter.sdk=%s\n' "$FLUTTER_ROOT" > local.properties
          printf 'sdk.dir=%s\n' "$ANDROID_SDK_ROOT" >> local.properties
      - name: Generate Gradle wrapper
        working-directory: JARVIS-32bit-corrected/jarvis_app/android
        run: gradle wrapper --gradle-version 9.5.0
      - name: Build 32-bit ARM release APK
        working-directory: JARVIS-32bit-corrected/jarvis_app
        run: flutter build apk --release --target-platform android-arm
      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-armv7-release
          path: JARVIS-32bit-corrected/jarvis_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
